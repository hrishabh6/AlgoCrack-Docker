global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: algocrack-backends
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:9090
          - auth-service:7483
          - problem-service:8084
          - submission-service:8080
          - code-execution-engine:8081
