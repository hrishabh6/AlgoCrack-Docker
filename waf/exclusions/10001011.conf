# Reviewed AlgoCrack exclusion 10001011: CRS 944110 on Playground run source.
# Reason: Java RuntimeException and java. imports match rule 944110.
# The source is also inside REQUEST_BODY, so that whole-document target is removed.
# Every other ARGS field stays inspected, so one field that contains both chain
# halves still matches. Splitting those halves across JSON fields bypasses only
# this chain, because REQUEST_BODY is what correlated them.
SecRule REQUEST_METHOD "@rx ^(?:POST)$" \
    "id:10001011,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^(?:/api/v1/playgrounds/run)/?$" \
        "t:none,ctl:ruleRemoveTargetById=944110;ARGS:json.sourceCode,ctl:ruleRemoveTargetById=944110;REQUEST_BODY"
