# Reviewed AlgoCrack exclusion 10001017: CRS 944110 on snippet create source.
# Reason: Java RuntimeException and java. imports match rule 944110.
# REQUEST_BODY is removed because it contains the same source document.
# Other ARGS fields on POST /api/v1/playgrounds stay inspected.
SecRule REQUEST_METHOD "@rx ^(?:POST)$" \
    "id:10001017,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/playgrounds/?$" \
        "t:none,ctl:ruleRemoveTargetById=944110;ARGS:json.sourceCode,ctl:ruleRemoveTargetById=944110;REQUEST_BODY"
