# Reviewed AlgoCrack exclusion 10001022: CRS 944110 on snippet update source.
# Reason: Java RuntimeException and java. imports match rule 944110.
# REQUEST_BODY is removed because it contains the same source document.
# Other ARGS fields on PUT /api/v1/playgrounds/{id} stay inspected.
SecRule REQUEST_METHOD "@rx ^(?:PUT)$" \
    "id:10001022,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/playgrounds/[0-9]+/?$" \
        "t:none,ctl:ruleRemoveTargetById=944110;ARGS:json.sourceCode,ctl:ruleRemoveTargetById=944110;REQUEST_BODY"
