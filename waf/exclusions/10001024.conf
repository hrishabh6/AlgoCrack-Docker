# Reviewed AlgoCrack exclusion 10001024: language-source compatibility policy.
# Java source can match PHP function signatures such as printf. Remove the
# PHP-injection rule family only from sourceCode on numeric Playground update
# requests. Attach ctl to the first chained rule for libModSecurity.
SecRule REQUEST_METHOD "@rx ^PUT$" \
    "id:10001024,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.sourceCode,chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/playgrounds/[0-9]+/?$" \
        "t:none"
