# Reviewed AlgoCrack exclusion 10001021: CRS 934160 on snippet update source.
# Reason: Java while(true) matches Node.js rule 934160
# Path is numeric snippet ids only: PUT /api/v1/playgrounds/{id}
SecRule REQUEST_METHOD "@rx ^(?:PUT)$" \
    "id:10001021,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/playgrounds/[0-9]+/?$" \
        "t:none,ctl:ruleRemoveTargetById=934160;ARGS:json.sourceCode"
