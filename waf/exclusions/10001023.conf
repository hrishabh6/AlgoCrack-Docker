# Reviewed AlgoCrack exclusion 10001023: language-source compatibility policy.
# Java source can match PHP function signatures such as printf. Remove the
# PHP-injection rule family only from sourceCode on Playground create and run
# requests. Attach ctl to the first chained rule: libModSecurity applies it
# only after the complete chain matches.
SecRule REQUEST_METHOD "@rx ^POST$" \
    "id:10001023,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.sourceCode,chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/playgrounds(?:/run)?/?$" \
        "t:none"
