# Reviewed AlgoCrack exclusion 10001018: CRS 932125 on snippet update source.
# Reason: Java catch and brace syntax matches Unix shell rule 932125
# Path is numeric snippet ids only: PUT /api/v1/playgrounds/{id}
SecRule REQUEST_METHOD "@rx ^(?:PUT)$" \
    "id:10001018,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/playgrounds/[0-9]+/?$" \
        "t:none,ctl:ruleRemoveTargetById=932125;ARGS:json.sourceCode"
