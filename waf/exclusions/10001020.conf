# Reviewed AlgoCrack exclusion 10001020: CRS 932370 on snippet update source.
# Reason: Java catch blocks match Unix shell rule 932370
# Path is numeric snippet ids only: PUT /api/v1/playgrounds/{id}
SecRule REQUEST_METHOD "@rx ^(?:PUT)$" \
    "id:10001020,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/playgrounds/[0-9]+/?$" \
        "t:none,ctl:ruleRemoveTargetById=932370;ARGS:json.sourceCode"
