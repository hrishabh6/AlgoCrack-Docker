# Narrow false-positive exclusion for AlgoCrack submission source code.
#
# Verified JSON field name: "code"
#   SubmissionRequestDto, RunRequestDto, CustomExecutionRequestDto
# Paths:
#   POST /api/v1/submissions
#   POST /api/v1/submissions/run
#   POST /api/v1/submissions/custom
#
# ModSecurity's JSON body processor exposes that field as ARGS:json.code.
# Only attack-sqli and attack-xss targets for that field are removed.
# questionId, language, headers, and the path stay fully inspected.
# A query parameter that is also named "code" on these three POST paths is
# covered by the ARGS:code removal. Other query parameters are not.
# Request size, methods, and CRS rules outside attack-sqli / attack-xss stay on.
# Playground uses sourceCode (ARGS:json.sourceCode) and is not excluded.
#
# Phase 2, and this file is loaded before the CRS attack rules, so the ctl
# actions are in effect when those rules run.

SecRule REQUEST_METHOD "@streq POST" \
    "id:10001001,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_URI "@rx ^/api/v1/submissions(?:/(?:run|custom))?/?($|\?)" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.code,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.code,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:code,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:code"
