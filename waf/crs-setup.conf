# Effective CRS setup for this image.
#
# The container does not replace /opt/owasp-crs/crs-setup.conf.
# On start, the OWASP image entrypoint writes the values below into that
# file from the environment. Dockerfile, Compose, and the cluster all set:
#
#   BLOCKING_PARANOIA=1
#   DETECTION_PARANOIA=1
#   ANOMALY_INBOUND=5
#   ANOMALY_OUTBOUND=4
#
# Those are paranoia level 1 and the standard CRS anomaly thresholds.
# SecRuleEngine is not set here. It lives in modsecurity.conf and follows
# MODSEC_RULE_ENGINE (default DetectionOnly).

SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:tx.blocking_paranoia_level=1"

SecAction \
    "id:900001,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:tx.detection_paranoia_level=1"

SecAction \
    "id:900110,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"
