load_module modules/ngx_http_modsecurity_module.so;
# allows to add cors headers when replying with 403
load_module modules/ngx_http_headers_more_filter_module.so;

worker_processes ${NGINX_WORKER_PROCESSES};
pid /tmp/nginx.pid;

events {
    worker_connections ${WORKER_CONNECTIONS};
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_timeout ${CLIENT_BODY_TIMEOUT};
    keepalive_timeout ${KEEPALIVE_TIMEOUT};
    sendfile on;
    http2 ${HTTP2};

    port_in_redirect ${NGINX_PORT_IN_REDIRECT};

    # Local/demo limits, per client address. Not distributed.
    # $binary_remote_addr is the TCP peer, unless that peer is listed in
    # SET_REAL_IP_FROM. Only then is X-Real-IP used. X-Forwarded-For is not.
    # general /api/* : 10 r/s, burst 20
    # auth            :  2 r/s, burst 5
    # submissions     :  5 r/s, burst 10
    # complexity      :  1 r/s, burst 2
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api_submit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_complexity:10m rate=1r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # Placeholders rewritten by the image entrypoint. Do not rename them.
    resolver RESOLVERS RESOLVER_CONFIG;
    include /etc/nginx/conf.d/*.conf;
}
