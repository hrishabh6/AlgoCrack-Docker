# HTTP listener for the AlgoCrack API. TLS, when used, terminates at ingress.
# PROXY_SSL_CONFIG is replaced by the image entrypoint.

server_tokens ${SERVER_TOKENS};

more_set_headers 'Server: ${SERVER_HEADER}';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${PORT} default_server;
    server_name ${SERVER_NAME};

    set $always_redirect ${NGINX_ALWAYS_TLS_REDIRECT};
    PROXY_SSL_CONFIG

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        client_max_body_size 1m;
        include includes/cors.conf;
        include includes/proxy_backend.conf;
    }

    # More specific than /api/v1/submissions. Regex locations win over prefixes.
    location ~ ^/api/v1/submissions/[^/]+/complexity-analyses(?:/|$) {
        limit_req zone=api_complexity burst=2 nodelay;
        client_max_body_size 1m;
        include includes/cors.conf;
        include includes/proxy_backend.conf;
    }

    location /api/v1/submissions {
        limit_req zone=api_submit burst=10 nodelay;
        client_max_body_size 1m;
        include includes/cors.conf;
        include includes/proxy_backend.conf;
    }

    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        client_max_body_size 1m;
        include includes/cors.conf;
        include includes/proxy_backend.conf;
    }

    location / {
        return 404;
    }

    include includes/location_common.conf;
}
